# lefthook's install script fetches the Go binary that runs the git hooks, so it
# has to be allowed; pnpm blocks every other package's scripts by default.
onlyBuiltDependencies:
  - lefthook

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Patched versions of what Lighthouse CI pulls in (dev only); its latest release
# still pins the vulnerable ones. extract-zip has no patched release yet.
overrides:
  tmp: '>=0.2.6'
  basic-ftp: '>=6.2.1'
  uuid: '>=11.1.1'
  chromium-bidi>zod: '>=4.6.6'
