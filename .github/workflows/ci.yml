name: CI

on:
  pull_request:
  push:
    branches: [main]

# A superseded pull request run is wasted compute; a push to main is history and
# always runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # The static gates share one shape and differ only by the script they run, so
  # they are one job definition fanned out rather than copies. fail-fast is
  # off: knowing that three of them failed is worth more than finishing a few
  # seconds sooner. The tests run with coverage, so a drop below the thresholds
  # in vitest.config.mts fails the job.
  verify:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate: [typecheck, lint, format:check, boundaries, test:coverage, test:fork]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm ${{ matrix.gate }}

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'src/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # No secrets are provided on purpose: the build must not need runtime
      # credentials. Environment variables are validated lazily, at first use.
      - run: pnpm build

  # The critical journeys in Chromium, against the production build the
  # Playwright config starts. No secrets either: the assistant answers from the
  # fast path, so the run is deterministic and never reaches OpenAI.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Each Playwright release pins its own browser build, so the version is the key.
      - name: Restore the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The cache holds the browser, not the apt packages it links against.
      - name: Install Chromium's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e

      # The same journeys can't reach a language the profile has not published,
      # so it is built again with Portuguese previewed and its journeys run.
      - run: pnpm test:e2e:preview

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The profile store against a real Postgres 17. Not a service container: the
  # tools never accept an unverified certificate, not even in a test, so the
  # job generates a CA and a server certificate first and starts Postgres with
  # them. No secret is involved — the database lives and dies with the job.
  store:
    name: store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The script writes the two variables to $GITHUB_ENV itself, and prints
      # only the mask for the password it generated.
      - name: Start Postgres with TLS
        run: scripts/profile/store/testing/postgres.sh start

      - run: pnpm test:store

      - name: Show the Postgres log of a failed run
        if: failure()
        run: docker logs profile-store-postgres

      - name: Stop Postgres
        if: always()
        run: scripts/profile/store/testing/postgres.sh stop

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # The commit-msg hook only protects whoever installed it. This is the
      # check that cannot be skipped.
      - name: Lint the commits in this pull request
        run: >
          pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # The performance budget. Lighthouse runs three times against a production
  # build and the job fails when the budgets in lighthouserc.json are missed.
  lhci:
    name: lhci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lighthouse
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14

  # One status that summarises the rest, so branch protection can require a
  # single check instead of a list that has to be edited whenever a job is added.
  ci:
    name: ci
    if: always()
    needs: [verify, build, e2e, store, commits, lhci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any gate did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more gates failed. See the jobs above."
          exit 1
      - run: echo "All gates passed."

  # Versioning is derived from the commits that reached main, and only once
  # every gate has passed. It never runs on a pull request, so it never shows
  # up in the list of checks a pull request has to satisfy.
  release:
    name: release
    # always() is required, not decorative: `commits` is skipped on a push to
    # main, and that skip propagates down the needs graph to any job that does
    # not opt out of it. The explicit needs.ci.result check keeps the property
    # the implicit one was there for — a broken main is never tagged.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' }}
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
      issues: write # comment on the issues a release closes
      pull-requests: write # comment on the pull requests it contains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release decides the next version by reading every existing
          # tag, so a shallow clone would make it start from zero each time.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
