# The fictional person's answers. Each states facts read from the record, and each
# scored intent opens with a marker naming it, so a test can tell which answer ran.

identity:
  parts:
    - text: '[identity] {{profile.name}} — {{#with experience | first}}{{.role}} at {{.company}}{{/with}}.'
  followUps: &followUps
    - "Tell me about {{first}}'s career."
    - 'Which skills does she have?'
    - 'How can I contact {{first}}?'
  sources: &profileSource
    - '{{profile.source}}'

resume:
  parts:
    - text: '[resume] [Download her CV]({{#if contact.resumeUrl}}{{contact.resumeUrl}}{{/if}})'
  followUps: *followUps
  sources: *profileSource

contact:
  parts:
    - text: '[contact] {{contact.email}}'
    - contactCard: true
  followUps: *followUps
  sources: *profileSource

location:
  parts:
    - text: '[location] {{#if profile.location.city}}{{profile.location.city}}{{/if}}, {{profile.location.country}}'
  followUps: *followUps
  sources: *profileSource

