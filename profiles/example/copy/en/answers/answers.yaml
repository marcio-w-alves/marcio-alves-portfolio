career:
  parts:
    - text: '[career] {{#each experience sep="; "}}{{.role}} at **{{.company}}** ({{.period}}){{/each}}'
    - timeline: all
    - text: |-
        ### Where she is headed
        {{practice.goals.roles}}
  followUps: *followUps
  sources: *profileSource

greeting:
  parts:
    - text: 'Hello — I answer about {{profile.name}}.'
  followUps: *followUps
  sources: []

privateInfo:
  parts:
    - text: 'That is private to {{first}}.'
  followUps: *followUps
  sources: []
  grounded: false

offPurpose:
  parts:
    - text: 'I only answer about her work.'
  followUps: *followUps
  sources: []
  grounded: false

unknown:
  parts:
    - text: "Not in {{first}}'s record."
  followUps: *followUps
  sources: []
  grounded: false

slowDown:
  parts:
    - text: 'Slow down, please.'
  followUps: *followUps
  sources: []
  grounded: false

company:
  parts:
    - text: '{{role.role}} at **{{role.company}}** ({{role.period}}).'
  followUps: *followUps
  sources: ['{{role.source}}']
  related: '{{role.id}}'

project:
  parts:
    - text: '**{{project.name}}** — {{project.description}}'
    - projects: { from: project.id }
    - text: '{{practice.productDepth[project.id]}}'
  followUps: *followUps
  sources: ['{{project.source}}']

technology:
  parts:
    - text: '{{#each evidence sep="\n"}}{{.technology.name}}: {{.work | count}} roles{{/each}}'
  followUps: *followUps
  sources: []
  grounded: false
